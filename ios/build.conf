# VLC's own Apple build configuration (extras/package/apple/build.conf), with what kobbler's
# apps never play left out, as the other builds leave it out. ios/build.sh hands this to VLC's
# build.sh, which sources it.
. "$VLC_SCRIPT_DIR/build.conf"

# Contribs nothing kept would link, so the simulator's, built from source, take less time.
# The contrib bootstrap refuses a package both enabled and disabled.
KOBVLC_CONTRIB_BASE=()
for option in "${VLC_CONTRIB_OPTIONS_BASE[@]}"; do
    case "$option" in --enable-taglib|--enable-libdsm) ;; *) KOBVLC_CONTRIB_BASE+=( "$option" ) ;; esac
done
VLC_CONTRIB_OPTIONS_BASE=( "${KOBVLC_CONTRIB_BASE[@]}" )
VLC_CONTRIB_OPTIONS_IOS+=(
    --disable-taglib --disable-libdsm --disable-smb2 --disable-nfs --disable-ssh2
    --disable-libarchive --disable-upnp --disable-microdns --disable-live555
    --disable-libaribcaption --disable-fluidlite --disable-modplug --disable-twolame
    --disable-x264 --disable-x265 --disable-bluray --disable-dvdread --disable-dvdnav
)

VLC_CONFIG_OPTIONS_IOS+=(
    --disable-chromecast --disable-sout --disable-bluray --disable-dvdread --disable-dvdnav
    --disable-smb2 --disable-nfs --disable-sftp --disable-upnp --disable-microdns
    --disable-live555 --disable-taglib --disable-archive --disable-gme --disable-fluidsynth
    --disable-mod --disable-aribcaption --disable-srt --disable-x264 --disable-x26410b
    --disable-twolame --disable-aom --disable-dsm
)

# modules-blacklist, as the globs VLC's removal step matches plugin archives with.
read -r -a KOBVLC_BLACKLIST_GLOBS <<< "$KOBVLC_BLACKLIST_GLOBS"
VLC_MODULE_REMOVAL_LIST_IOS+=( "${KOBVLC_BLACKLIST_GLOBS[@]}" )
